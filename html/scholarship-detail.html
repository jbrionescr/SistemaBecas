<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Beca - Alas al Futuro</title>
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>
    <div class="mouse-glow"></div>
    <nav class="dashboard-nav">
        <div class="container nav-content">
            <div class="nav-brand">
                <img src="../assets/logo.png" alt="Logo" class="nav-logo">
                Alas al Futuro
            </div>
            <div class="nav-user">
                <a href="dashboard.html" class="btn btn-sm btn-outline">Volver al Panel</a>
            </div>
        </div>
    </nav>
    <div class="extra-blob"></div>

    <main class="container animate-fade">
        <div id="loading" class="text-muted" style="text-align: center; margin-top: 5rem;">Cargando información de la
            beca...</div>

        <div id="scholarshipContent" class="hidden">
            <div class="view-header" style="margin-top: 2rem;">
                <div>
                    <h1 id="bTitle" style="font-size: 2.5rem; font-weight: 800; color: var(--p-700);">Nombre de la Beca
                    </h1>
                    <span id="bBadge" class="badge" style="margin-top: 0.5rem; display: inline-block;">Estado</span>
                </div>
            </div>

            <div class="detail-grid">
                <div class="section">
                    <div class="card" style="max-width: 100%; margin-bottom: 2rem;">
                        <h3 style="color: var(--p-600); margin-bottom: 1rem;">Descripción</h3>
                        <p id="bDescription" style="font-size: 1.1rem; color: var(--text-main); line-height: 1.8;">
                            Loading description...
                        </p>

                        <h3 style="color: var(--p-600); margin: 2rem 0 1rem;">Requisitos Obligatorios</h3>
                        <div id="bRequirements"
                            style="white-space: pre-line; background: var(--bg-page); padding: 1.5rem; border-radius: 0.75rem; border: 1px dashed var(--border);">
                            Loading requirements...
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="sidebar-card">
                        <h3 style="font-size: 1.1rem; margin-bottom: 1rem;">Información Clave</h3>
                        <div style="margin-bottom: 1rem;">
                            <small class="text-muted">Monto de la Beca</small>
                            <p id="bAmount" style="font-size: 1.5rem; font-weight: 700; color: var(--success);">$0.00
                            </p>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <small class="text-muted">Tipo de Beca</small>
                            <p id="bType" style="font-weight: 600;">Académica</p>
                        </div>
                        <div style="margin-bottom: 1.5rem;">
                            <small class="text-muted">Cierre de Convocatoria</small>
                            <p id="bDeadline" style="font-weight: 600; color: var(--danger);">01/01/2026</p>
                        </div>

                        <button id="applyBtn" class="btn btn-primary btn-block">Postularse Ahora</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const becaId = params.get('id');

            if (!becaId) {
                window.location.href = 'dashboard.html';
                return;
            }

            const scholarships = Storage.get(Storage.KEYS.SCHOLARSHIPS);
            const b = scholarships.find(s => s.id === becaId);

            if (!b) {
                alert('Beca no encontrada');
                window.location.href = 'dashboard.html';
                return;
            }

            // Populate page
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('scholarshipContent').classList.remove('hidden');

            document.getElementById('bTitle').textContent = b.name;
            document.getElementById('bDescription').textContent = b.description || 'Sin descripción detallada.';
            document.getElementById('bRequirements').textContent = b.requirements || 'Sin requisitos específicos.';
            document.getElementById('bAmount').textContent = `$${(parseFloat(b.amount) || 0).toLocaleString()}`;
            document.getElementById('bType').textContent = b.type;
            document.getElementById('bDeadline').textContent = b.deadline;

            const badge = document.getElementById('bBadge');
            badge.textContent = b.status;
            badge.style.background = b.status === 'Abierta' ? 'var(--success)' : 'var(--danger)';
            badge.style.color = 'white';

            const applyBtn = document.getElementById('applyBtn');
            if (b.status === 'Cerrada') {
                applyBtn.disabled = true;
                applyBtn.textContent = 'Convocatoria Cerrada';
                applyBtn.style.opacity = '0.5';
                applyBtn.style.cursor = 'not-allowed';
            } else {
                applyBtn.onclick = () => {
                    // We can't use the modal logic directly here as it's in dashboard.js
                    // But we can redirect or show an alert, or simplify
                    alert('Para postularte, por favor usa el botón de "Postularse" en el panel principal.');
                    window.location.href = 'dashboard.html';
                };
            }
        });
    </script>
</body>

</html>
