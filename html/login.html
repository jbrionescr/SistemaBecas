<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundación Alas al Futuro - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="auth-container">
    <div class="mouse-glow"></div>
    <div class="extra-blob"></div>

    <div class="card animate-fade">
        <div class="auth-header">
            <div style="text-align: center; margin-bottom: 1rem;">
                <img src="../Imagenes/logo.png" alt="Logo" style="height: 80px; width: auto;">
            </div>
            <h1>Bienvenido</h1>
            <p style="color: var(--text-muted)">Fundación Alas al Futuro</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" class="form-input" required placeholder="ej. admin">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-input" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
                ¿No tienes cuenta? <a href="#" id="toRegister"
                    style="color: var(--p-600); text-decoration: none; font-weight: 600;">Regístrate</a>
            </p>
            <p style="text-align: center; margin-top: 1rem;">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.875rem;">←
                    Volver al inicio</a>
            </p>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label for="regFullname">Nombre Completo</label>
                <input type="text" id="regFullname" class="form-input" required placeholder="Juan Pérez">
            </div>
            <div class="form-group">
                <label for="regAge">Edad</label>
                <input type="number" id="regAge" class="form-input" required placeholder="Ej. 20" min="10" max="100">
            </div>
            <div class="form-group">
                <label for="regUsername">Nombre de Usuario</label>
                <input type="text" id="regUsername" class="form-input" required placeholder="juanp">
            </div>
            <div class="form-group">
                <label for="regRole">Tipo de Usuario</label>
                <select id="regRole" class="form-input" required>
                    <option value="student">Estudiante (Postulante)</option>
                    <option value="evaluator">Evaluador</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <div class="form-group">
                <label for="regPassword">Contraseña</label>
                <input type="password" id="regPassword" class="form-input" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="regPasswordConfirm">Confirmar Contraseña</label>
                <input type="password" id="regPasswordConfirm" class="form-input" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
                ¿Ya tienes cuenta? <a href="#" id="toLogin"
                    style="color: var(--p-600); text-decoration: none; font-weight: 600;">Inicia Sesión</a>
            </p>
            <p style="text-align: center; margin-top: 1rem;">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.875rem;">←
                    Volver al inicio</a>
            </p>
        </form>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/script.js"></script>
</body>

</html>
