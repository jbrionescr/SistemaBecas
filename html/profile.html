<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Alas al Futuro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="mouse-glow"></div>
    <nav class="dashboard-nav">
        <div class="container nav-content">
            <div class="nav-brand">
                <img src="../Imagenes/logo.png" alt="Logo" class="nav-logo">
                Alas al Futuro
            </div>
            <div class="nav-user">
                <a href="dashboard.html" class="btn btn-sm btn-outline">Volver al Panel</a>
            </div>
        </div>
    </nav>
    <div class="extra-blob"></div>

    <main class="container animate-fade">
        <div style="max-width: 800px; margin: 3rem auto;">
            <div class="card" style="max-width: 100%;">
                <div class="auth-header">
                    <h1>Mi Perfil</h1>
                    <p style="color: var(--text-muted)">Gestiona tu información personal y de cuenta.</p>
                </div>

                <form id="profileForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label for="profFullname">Nombre Completo</label>
                            <input type="text" id="profFullname" class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="profUsername">Nombre de Usuario</label>
                            <input type="text" id="profUsername" class="form-input" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="profRole">Rol en el Sistema</label>
                        <input type="text" id="profRole" class="form-input" readonly>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border); margin: 2rem 0;">

                    <h3 style="margin-bottom: 1.5rem;">Cambiar Contraseña</h3>
                    <div class="form-group">
                        <label for="newPassword">Nueva Contraseña</label>
                        <input type="password" id="newPassword" class="form-input" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary">Actualizar Mi Información</button>
                    <a href="dashboard.html" class="btn btn-outline">Cancelar</a>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = Auth.getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('profFullname').value = user.fullName;
            document.getElementById('profUsername').value = user.username;
            document.getElementById('profRole').value = user.role.toUpperCase();

            document.getElementById('profileForm').addEventListener('submit', (e) => {
                e.preventDefault();

                const newFullname = document.getElementById('profFullname').value;
                const newPass = document.getElementById('newPassword').value;

                // Update in storage
                const users = Storage.get(Storage.KEYS.USERS);
                const idx = users.findIndex(u => u.id === user.id);
                if (idx !== -1) {
                    users[idx].fullName = newFullname;
                    if (newPass) users[idx].password = newPass;
                    Storage.save(Storage.KEYS.USERS, users);

                    // Update session
                    user.fullName = newFullname;
                    localStorage.setItem(Storage.KEYS.CURRENT_USER, JSON.stringify(user));

                    Storage.addLog('PROFILE_UPDATED', user.id, 'Información de perfil actualizada');
                    alert('Perfil actualizado con éxito');
                    window.location.href = 'dashboard.html';
                }
            });
        });
    </script>
</body>

</html>
