<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Alas al Futuro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="mouse-glow"></div>
    <nav class="dashboard-nav">
        <div class="container nav-content">
            <div class="nav-brand">
                <img src="../assets/logo.png" alt="Logo" class="nav-logo">
                Alas al Futuro
            </div>
            <div class="nav-user">
                <a href="dashboard.html" class="btn btn-sm btn-outline">Volver al Panel</a>
            </div>
        </div>
    </nav>
    <div class="extra-blob"></div>

    <main class="container animate-fade">
        <div style="max-width: 800px; margin: 3rem auto;">
            <div class="card" style="max-width: 100%;">
                <div class="auth-header">
                    <h1>Contáctanos</h1>
                    <p style="color: var(--text-muted)">Estamos aquí para ayudarte con tus dudas sobre las becas.</p>
                </div>

                <form id="contactForm">
                    <div class="form-group">
                        <label for="contactName">Nombre Completo</label>
                        <input type="text" id="contactName" class="form-input" required placeholder="Tu nombre...">
                    </div>
                    <div class="form-group">
                        <label for="contactEmail">Correo Electrónico</label>
                        <input type="email" id="contactEmail" class="form-input" required
                            placeholder="correo@ejemplo.com">
                    </div>
                    <div class="form-group">
                        <label for="contactSubject">Asunto</label>
                        <select id="contactSubject" class="form-input">
                            <option value="duda">Duda sobre requisitos</option>
                            <option value="problema">Problema con la postulación</option>
                            <option value="otro">Otro motivo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="contactMessage">Mensaje</label>
                        <textarea id="contactMessage" class="form-input" rows="5" required
                            placeholder="Escribe tu mensaje aquí..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('contactName').value;
            const email = document.getElementById('contactEmail').value;
            const subject = document.getElementById('contactSubject').value;
            const message = document.getElementById('contactMessage').value;
            const user = Auth.getCurrentUser();

            const messages = Storage.get(Storage.KEYS.MESSAGES);
            const newMessage = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                name,
                email,
                subject,
                message,
                userId: user ? user.id : 'anonymous'
            };

            messages.push(newMessage);
            Storage.save(Storage.KEYS.MESSAGES, messages);
            Storage.addLog('MESSAGE_SENT', user ? user.id : 'anonymous', 'Mensaje de contacto enviado');

            alert('¡Gracias por contactarnos! Tu mensaje ha sido enviado al administrador.');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>

</html>
